name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Red Eating Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF0000&color_dots=#161B22,#67000D,#A50F15,#CB181D,#FF4444
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF0000&color_dots=#161B22,#67000D,#A50F15,#CB181D,#FF4444
            dist/github-snake.gif?color_snake=#FF0000&color_dots=#161B22,#67000D,#A50F15,#CB181D,#FF4444
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
